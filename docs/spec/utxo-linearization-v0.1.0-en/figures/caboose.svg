<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="670" viewBox="0 0 1440 670" role="img" aria-labelledby="title desc">
<title id="title">How caboose binds state to the main program</title><desc id="desc">The state envelope is hashed into an OP_RETURN witnessScript and then into a P2WSH output. This output shares a transaction with the main program. The next spend authenticates that transaction through its txid.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526777" /></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#20333d} .title{font-size:32px;font-weight:650} .sub{font-size:19px;fill:#59717e} .label{font-size:22px;font-weight:600} .body{font-size:20px} .small{font-size:17px;fill:#59717e} .mono{font-family:Menlo,Consolas,monospace;font-size:18px} .edge{fill:none;stroke:#526777;stroke-width:2.5;marker-end:url(#arrow)} </style>
<rect width="1440" height="670" fill="#f8fafb" />
<text x="64" y="54" class="title">How caboose binds state to the main program</text>
<text x="64" y="88" class="sub">Arrows show commitment relationships. The next execution supplies the data and recomputes them.</text>
<rect x="64" y="143" width="368" height="134" rx="12" fill="#ffffff" stroke="#d2dde2" stroke-width="1.5" />
<rect x="528" y="143" width="328" height="134" rx="12" fill="#ffffff" stroke="#d2dde2" stroke-width="1.5" />
<rect x="952" y="143" width="424" height="134" rx="12" fill="#ffffff" stroke="#d2dde2" stroke-width="1.5" />
<text x="88" y="181" class="label">State envelope S</text>
<text x="88" y="217" class="mono">phase + [genesis_id] + app_root</text>
<text x="88" y="250" class="small">GENESIS: 41 bytes / ACTIVE: 73 bytes</text>
<text x="552" y="181" class="label">State hash h</text>
<text x="552" y="220" class="mono">h = SHA256(Encode(S))</text>
<text x="552" y="252" class="small">32 bytes</text>
<text x="976" y="181" class="label">witnessScript w</text>
<text x="976" y="219" class="mono">6a 24 || h || LE32(r)</text>
<text x="976" y="252" class="small">OP_RETURN + 36-byte payload</text>
<polyline points="432,210 527,210" class="edge" />
<polyline points="856,210 951,210" class="edge" />
<rect x="952" y="367" width="424" height="154" rx="12" fill="#eef2fb" stroke="#afbfdc" stroke-width="1.5" />
<text x="976" y="407" class="label">Caboose output</text>
<text x="976" y="445" class="mono">00 20 || SHA256(w)</text>
<text x="976" y="480" class="body">P2WSH · Last output · Amount c</text>
<polyline points="1164,277 1164,366" class="edge" />
<rect x="528" y="367" width="328" height="154" rx="12" fill="#edf6f3" stroke="#9ebfaf" stroke-width="1.5" />
<text x="552" y="407" class="label">Creating transaction T</text>
<text x="552" y="445" class="mono">output[0] = main program P</text>
<text x="552" y="480" class="body">Last output = caboose</text>
<polyline points="952,444 857,444" class="edge" />
<rect x="64" y="367" width="368" height="154" rx="12" fill="#ffffff" stroke="#d2dde2" stroke-width="1.5" />
<text x="88" y="407" class="label">Next spend of U</text>
<text x="88" y="445" class="mono">U = (txid(T), 0)</text>
<text x="88" y="480" class="body">Actual outpoint authenticates T</text>
<polyline points="528,444 433,444" class="edge" />
<text x="64" y="589" class="sub">Authenticate old state: supply S, r, and T without witness; recompute and match the actual spent outpoint.</text>
<text x="64" y="624" class="sub">Caboose stores only a commitment; the application must arrange state data availability.</text>
</svg>